name: Build and deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node（主题 CSS 走 PostCSS，必须有 postcss-cli）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostCSS dependencies
        run: npm ci || npm install

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.1'
          extended: true

      - name: Build
        run: |
          # Hugo 调用 postcss 时找的是 PATH，不认 node_modules/.bin，必须显式加进去
          export PATH="$PWD/node_modules/.bin:$PATH"
          hugo --minify --baseURL "https://zhizunxiaren.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
